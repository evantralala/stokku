<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a1020">
    <title>Tidak ada koneksi</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: #0a1020;
            color: #e8ecf4;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        main { max-width: 360px; }
        .ikon { display: block; margin: 0 auto 20px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { margin: 0 0 24px; color: #9aa6bd; font-size: 15px; line-height: 1.5; }
        button {
            min-height: 48px;
            padding: 0 24px;
            border: 0;
            border-radius: 12px;
            background: #dd2a23;
            color: #fff;
            font: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <svg class="ikon" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#dd2a23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/><path d="M3 3l18 18"/></svg>
        <h1>Tidak ada koneksi internet</h1>
        <p>Data stok selalu diambil langsung dari server. Sambungkan HP ke internet, lalu coba lagi.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
</body>
</html>
